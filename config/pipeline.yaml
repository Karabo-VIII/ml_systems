windows:
  version: windows_v2
  z: 200
  fast: 20
  vol_cluster: 50
  frac_diff: 1000
  frac_diff_d: 0.4
  hurst: 200
  kurtosis: 50
  efficiency: 10
  perm_entropy: 100
  perm_m: 3
  kyle: 50
  yz: 20
  cs_block: 10
  hawkes_span: 20
  ma: 200
  # Every EMA is evaluated over its last `ema` bars (normalised weights), so
  # no feature has infinite memory; scaled down on coarse cadences.
  ema: 240
  # Rolling median that caps open interest (--include-oi only).
  oi_median: 50
  horizons:
  - 1
  - 4
  - 16
  - 64
  calendar_floor_days: 7
  max_lookback_days: 90
splits:
  version: splits_v1
  train_end: '2023-07-01'
  val_end: '2024-05-15'
  oos_end: '2025-03-15'
  unseen_start: '2025-03-15'
  live_start: '2025-09-03'
backtest:
  # Research cost model for strategy/. Charge on turnover (|delta position|)
  # at the fill. fee_bps is a published commission. half_spread_bps is only
  # the fallback when the bar has no quote; FX gold uses bid/ask or
  # spread_mean when those columns are present. slippage_bps is an
  # assumption, not a quoted fee. Change these in this file, not in code.
  crypto:
    # Binance spot Regular User (VIP 0) maker/taker, no BNB discount: 0.100%.
    # Gold is Vision spot aggTrades, so this is the spot schedule, not USD-M
    # futures. Source opened 2026-11-20: https://www.binance.info/en-JP/fee
    # (the /en/fee/schedule page timed out from this machine the same day).
    fee_bps: 10.0
    # Assumption, not a quoted fee. The archived prod config used 2 bps
    # (SPOT_SLIPPAGE = 0.0002 in ml_systems_v1/crypto/src/prod/config.py).
    # Kept as a research placeholder until live slippage is measured.
    slippage_bps: 2.0
    # Spot gold has no bid/ask. Used only if a spread column is absent.
    half_spread_bps: 0.0
  fx:
    # Dukascopy Europe JForex self-trader, net deposit and equity under
    # USD 5,000: USD 35 per USD 1 million per side = 0.35 bps. Higher
    # deposit/equity tiers are cheaper; this is the most conservative
    # published self-trader currency rate. Source opened 2026-11-20:
    # https://www.dukascopy.com/europe/english/about/fee-schedule/
    fee_bps: 0.35
    # Assumption: no extra slippage beyond the recorded quote, until measured.
    slippage_bps: 0.0
    # Fallback only when bid_close/ask_close and spread_mean are missing.
    # Not a typical pip width presented as fact.
    half_spread_bps: 0.0
lags:
  version: lags_v3
  day_ms: 86400000
  families:
    trades: 0
    time_bars: 0
    dollar_bars: 0
    funding: 0
    # Vision metrics stamp a 5-minute window by its START (create_time T). Measured
    # on 2026-11-09..15: corr(|dOI(T)|, |ret of the 5m bar ending T+5m|) = 0.74-0.87
    # versus 0.15-0.25 for the bars ending at T-5m..T+15m, so the value stamped T
    # describes the state at T+5m. One window (5m) is the earliest it can exist;
    # a second window (10m total) is the publication margin.
    open_interest: 600000
    daily_panel: 86400000
    funding_daily: 86400000
    # Pageviews and Farside flows for day D are posted after day D closes and
    # Farside revises; two days keeps them behind any plausible publication time.
    wikipedia: 172800000
    etf: 172800000
    defillama: 86400000
    deribit: 86400000
    whale: 86400000
    realized_vol: 86400000
    hawkes_daily: 86400000
    basis: 86400000
    # The day-D mean of Vision metrics includes the window stamped D 23:55, which is
    # knowable 10 minutes after its stamp (open_interest), at (D+1) 00:05: so the mean
    # is knowable one day plus five minutes after D 00:00.
    metrics_daily: 86700000
dollar_thresholds:
  version: dollar_thresholds_v3
  # Adaptive size (contract 2.2.0; calibration day since 2.5.0). The threshold for UTC day D is
  #   median(USD notional of the last window_days complete days before D) / target_bars_per_day
  # so every asset carries about target_bars_per_day dollar bars per day in 2020 and
  # in 2026 alike (288 = the count of 5-minute time bars, so the two fabrics are
  # directly comparable). It is causal: day D's own trades never set day D's size,
  # and a bar that is open at midnight keeps the size it opened with. The first day
  # of a chain has no history: it is a calibration day whose trades seed the history
  # and close no bar. No size is taken from a static table.
  calibration:
    method: trailing_median_daily_notional
    window_days: 30
    target_bars_per_day: 288
daily_thresholds:
  version: daily_thresholds_v3
  # The whale size of UTC day D is the `quantile` of per-trade notional over the
  # last `window_days` complete days before D. An asset's first day has no history,
  # so its wh_* columns are null (no static bootstrap size).
  whale:
    method: trailing_quantile_trade_notional
    window_days: 30
    quantile: 0.999
