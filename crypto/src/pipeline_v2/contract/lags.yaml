# Publication lags in milliseconds. knowable_at = event_time + lag_ms.
# A daily aggregate of day D uses event_time = D 00:00:00 UTC and lag_ms = 1 day,
# so it is first attachable at (D+1) 00:00:00.000 UTC.
version: lags_v1
day_ms: 86400000
families:
  trades: 0
  time_bars: 0
  dollar_bars: 0
  funding: 0          # event time is calc_time; do not add another 8h
  open_interest: 300000   # 5 minutes, and only when --include-oi
  daily_panel: 86400000
  etf: 86400000
  wikipedia: 86400000
  defillama: 86400000
  whale: 86400000
  liq_proxy: 86400000
  realized_vol: 86400000
  hawkes_daily: 86400000
  basis: 86400000
  metrics_daily: 86400000
